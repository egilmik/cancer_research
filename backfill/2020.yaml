# Backfill of every search with a PubMed query back to 2020-01-01.
# Created 2026-10-12. One chunk = one routine run (fire the routine with the chunk's `only`,
# `since` and `until`). Run chunks one at a time, oldest first, never while another run is in
# progress. `python scripts/backfill_status.py backfill/2020.yaml` shows which are done.
#
# Already covered before this plan: 2026 for all searches; 2024-2025 for egfr-nsclc,
# nsclc-resistance-nextgen, lung-top-journals, lung-mrna, car-t-solid (v2). lung-repurposed is
# repeated for 2024-2025 because those years were fetched with v1, before it was widened.
# Not backfillable: preprints, preprints-cell-therapy (feeds list only recent posts),
# approvals-access, guidelines-meetings (web queries have no date window).

groups:
  all: [egfr-nsclc, nsclc-resistance-nextgen, lung-key-evidence, lung-top-journals, lung-nonpharm, lung-mrna, lung-repurposed, car-t-solid, nsclc-drivers, sclc, nsclc-immunotherapy, lung-screening, lung-ctdna-mrd, lung-local-therapy, lung-nordic, lung-vaccines-cell, lung-toxicity, thoracic-other]
  new-in-2026-10: [lung-key-evidence, lung-nonpharm, lung-repurposed, nsclc-drivers, sclc, nsclc-immunotherapy, lung-screening, lung-ctdna-mrd, lung-local-therapy, lung-nordic, lung-vaccines-cell, lung-toxicity, thoracic-other]

