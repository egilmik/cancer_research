# Search definitions. One entry per search.
#
# Changing an existing query? Bump its `version`. That restarts its date window
# (initial_lookback_days) and makes it obvious in state/runs.jsonl which query found what.
# Already-recorded items are never reported again, whatever the version.
#
# PubMed note: brand-new records usually have no MeSH terms or publication types yet (indexing
# takes weeks), so these queries rely on title/abstract [tiab] words. MeSH/[pt] terms are kept
# only as extras.

settings:
  email: egilmikalsen@gmail.com      # NCBI asks for a contact address with E-utilities requests
  overlap_days: 3             # re-check this many days before the last window (indexing lag)
  initial_lookback_days: 30    # first run of a search (or new version) looks back this far; for a
                              # longer backfill, run with `since:` in a few chunks
  max_results: 500            # per request; longer PubMed windows are split by date to fit

searches:

  # ------------------------------------------------------------------ EGFR-mutant NSCLC
  - id: egfr-nsclc
    name: EGFR-mutant NSCLC — everything
    enabled: true
    version: 1
    criteria: >
      EGFR-mutant non-small cell lung cancer. HIGH: phase 2/3 results or updated survival data
      (e.g. FLAURA2, MARIPOSA and successors); new approvals, label changes or guideline updates;
      resistance mechanisms with treatment implications (C797S, MET, HER2, histologic
      transformation); new agents (4th-generation TKIs, ADCs, bispecifics, degraders/PROTACs);
      CNS efficacy; ctDNA/MRD-guided strategies; head-to-head or sequencing data.
      MEDIUM: large real-world cohorts, well-done meta-analyses, mechanistic studies with a clear
      clinical angle, differences in access or outcomes between countries.
      LOW: case reports, small single-centre retrospectives, bioinformatic signatures without
      validation, network-pharmacology papers, narrative reviews that add nothing new.
    pubmed:
      query: >-
        ("lung cancer"[tiab] OR "lung cancers"[tiab] OR "lung carcinoma"[tiab]
        OR "lung adenocarcinoma"[tiab] OR "lung adenocarcinomas"[tiab] OR NSCLC[tiab]
        OR "non-small cell lung"[tiab] OR "non-small-cell lung"[tiab]
        OR "Carcinoma, Non-Small-Cell Lung"[mh])
        AND
        (EGFR[tiab] OR EGFRm[tiab] OR "EGFR-mutant"[tiab] OR "EGFR-mutated"[tiab]
        OR "epidermal growth factor receptor"[tiab] OR "ErbB Receptors"[mh]
        OR L858R[tiab] OR "exon 19"[tiab] OR "exon 20"[tiab] OR T790M[tiab] OR C797S[tiab]
        OR "EGFR-TKI"[tiab] OR "EGFR-TKIs"[tiab]
        OR osimertinib[tiab] OR amivantamab[tiab] OR lazertinib[tiab] OR gefitinib[tiab]
        OR erlotinib[tiab] OR afatinib[tiab] OR dacomitinib[tiab] OR aumolertinib[tiab]
        OR almonertinib[tiab] OR furmonertinib[tiab] OR firmonertinib[tiab] OR befotertinib[tiab]
        OR rezivertinib[tiab] OR sunvozertinib[tiab] OR zipalertinib[tiab] OR mobocertinib[tiab])
    clinicaltrials:
      - {cond: "non-small cell lung cancer", term: "EGFR"}                                    # new registrations
      - {cond: "non-small cell lung cancer", term: "EGFR", date_field: ResultsFirstPostDate}  # results posted

  - id: nsclc-resistance-nextgen
    name: NSCLC resistance and next-generation agents
    enabled: true
    version: 1
    criteria: >
      Resistance and what comes after it in NSCLC, EGFR-mutant first. HIGH: clinical data on
      post-osimertinib options; ADCs (datopotamab deruxtecan, patritumab deruxtecan, sacituzumab
      tirumotecan and others); 4th-generation EGFR TKIs; EGFR degraders/PROTACs with in vivo data;
      MET- or HER2-directed strategies after EGFR TKIs; transformation to small cell.
      MEDIUM: preclinical work on these with a credible path to the clinic.
      LOW: ADC or resistance papers in other tumour types that only mention lung in passing.
    pubmed:
      query: >-
        ("lung cancer"[tiab] OR "lung adenocarcinoma"[tiab] OR NSCLC[tiab]
        OR "non-small cell lung"[tiab] OR "non-small-cell lung"[tiab])
        AND
        (C797S[tiab] OR "fourth-generation"[tiab] OR "fourth generation"[tiab]
        OR "4th-generation"[tiab] OR PROTAC[tiab] OR PROTACs[tiab] OR degrader[tiab]
        OR degraders[tiab] OR "acquired resistance"[tiab] OR "MET amplification"[tiab]
        OR "HER2 mutation"[tiab] OR "HER2 mutations"[tiab] OR "small cell transformation"[tiab]
        OR "histologic transformation"[tiab] OR "histological transformation"[tiab]
        OR datopotamab[tiab] OR "Dato-DXd"[tiab] OR "patritumab deruxtecan"[tiab]
        OR "HER3-DXd"[tiab] OR "sacituzumab tirumotecan"[tiab] OR "sac-TMT"[tiab]
        OR telisotuzumab[tiab] OR "antibody-drug conjugate"[tiab]
        OR "antibody-drug conjugates"[tiab])

  # ------------------------------------------------------------------ lung cancer in general
  - id: lung-key-evidence
    name: Lung cancer — trials, meta-analyses, guidelines
    enabled: true
    version: 1
    criteria: >
      All lung cancer (NSCLC, SCLC). HIGH: phase 3 results, practice-changing phase 2, new
      guidelines or consensus statements, screening trials, perioperative/adjuvant data,
      immunotherapy or targeted-therapy results in any driver subgroup.
      MEDIUM: phase 2 trials, rigorous meta-analyses of RCTs, protocol papers of major trials.
      LOW: meta-analyses of retrospective studies, trial-design commentaries, regional
      single-arm studies with small n.
    pubmed:
      query: >-
        ("lung cancer"[tiab] OR "lung cancers"[tiab] OR "lung carcinoma"[tiab]
        OR "lung adenocarcinoma"[tiab] OR NSCLC[tiab] OR SCLC[tiab]
        OR "non-small cell lung"[tiab] OR "non-small-cell lung"[tiab]
        OR "small cell lung"[tiab] OR "small-cell lung"[tiab])
        AND
        ("phase 3"[tiab] OR "phase III"[tiab] OR "phase 2"[tiab] OR "phase II"[tiab]
        OR randomized[tiab] OR randomised[tiab] OR "meta-analysis"[tiab]
        OR "systematic review"[tiab] OR guideline[tiab] OR guidelines[tiab] OR consensus[tiab]
        OR "Randomized Controlled Trial"[pt] OR "Clinical Trial, Phase III"[pt]
        OR "Practice Guideline"[pt])

  - id: lung-top-journals
    name: Lung cancer in major journals
    enabled: true
    version: 1
    criteria: >
      Anything on lung cancer in these journals deserves at least MEDIUM. HIGH if it reports
      trial results, changes practice, or explains a mechanism with treatment consequences.
      LOW for letters, corrections and short commentaries.
    pubmed:
      query: >-
        ("lung cancer"[tiab] OR "lung adenocarcinoma"[tiab] OR NSCLC[tiab] OR SCLC[tiab]
        OR "non-small cell lung"[tiab] OR "small cell lung"[tiab])
        AND
        ("N Engl J Med"[ta] OR "Lancet"[ta] OR "Lancet Oncol"[ta] OR "Lancet Respir Med"[ta]
        OR "J Clin Oncol"[ta] OR "JAMA"[ta] OR "JAMA Oncol"[ta] OR "Nat Med"[ta]
        OR "Ann Oncol"[ta] OR "Cancer Discov"[ta] OR "Cancer Cell"[ta]
        OR "J Thorac Oncol"[ta] OR "Nature"[ta] OR "Science"[ta] OR "Cell"[ta])

  - id: lung-nonpharm
    name: Lung cancer — non-pharmacological interventions
    enabled: true
    version: 1
    criteria: >
      Non-drug interventions in people with lung cancer and their effect on survival, treatment
      tolerance, complications or quality of life. HIGH: randomised trials and large prospective
      cohorts (exercise, prehabilitation, nutrition, body composition, sleep, psychosocial).
      MEDIUM: smaller trials, feasibility studies with outcome data, good meta-analyses.
      LOW: prevention/risk epidemiology in people without cancer, surveys, protocols.
    pubmed:
      query: >-
        ("lung cancer"[tiab] OR "lung adenocarcinoma"[tiab] OR NSCLC[tiab] OR SCLC[tiab]
        OR "non-small cell lung"[tiab] OR "small cell lung"[tiab])
        AND
        (exercise[tiab] OR "physical activity"[tiab] OR prehabilitation[tiab]
        OR rehabilitation[tiab] OR "physical function"[tiab] OR diet[tiab] OR dietary[tiab]
        OR nutrition[tiab] OR nutritional[tiab] OR fasting[tiab] OR "vitamin D"[tiab]
        OR "body composition"[tiab] OR sarcopenia[tiab] OR cachexia[tiab] OR sleep[tiab]
        OR mindfulness[tiab] OR yoga[tiab] OR psychosocial[tiab])

  # ------------------------------------------------------------------ mRNA therapeutics
  - id: lung-mrna
    name: Lung cancer — mRNA vaccines and mRNA therapeutics
    enabled: true
    version: 1
    criteria: >
      mRNA-based vaccines and therapeutics in lung cancer (NSCLC, SCLC), including lipid
      nanoparticle mRNA delivery. HIGH: clinical trial results or registrations (e.g. mRNA-4157/V940,
      BNT116, other individualised neoantigen or off-the-shelf mRNA vaccines, alone or with
      checkpoint inhibitors); immunogenicity or efficacy data in patients; mRNA-encoded cytokines,
      antibodies or CAR-T approaches with in vivo or clinical data.
      MEDIUM: preclinical in vivo studies with a credible clinical path, large real-world cohorts
      (e.g. COVID-19 mRNA vaccination and cancer outcomes), rigorous meta-analyses.
      LOW: narrative reviews, in vitro-only work, and mRNA expression or stability papers
      (m6A, biomarkers, signatures) where mRNA is a measured analyte and not the therapeutic.
    pubmed:
      query: >-
        ("lung cancer"[tiab] OR "lung cancers"[tiab] OR "lung carcinoma"[tiab]
        OR "lung adenocarcinoma"[tiab] OR NSCLC[tiab] OR SCLC[tiab]
        OR "non-small cell lung"[tiab] OR "non-small-cell lung"[tiab]
        OR "small cell lung"[tiab] OR "small-cell lung"[tiab])
        AND
        ("mRNA vaccine"[tiab] OR "mRNA vaccines"[tiab] OR "mRNA-based"[tiab]
        OR "mRNA cancer vaccine"[tiab] OR "mRNA therapeutics"[tiab] OR "mRNA therapy"[tiab]
        OR "mRNA delivery"[tiab] OR "mRNA-LNP"[tiab] OR "mRNA lipid nanoparticle"[tiab]
        OR "mRNA-4157"[tiab] OR V940[tiab] OR intismeran[tiab] OR BNT116[tiab]
        OR "neoantigen vaccine"[tiab] OR "neoantigen vaccines"[tiab]
        OR "personalized cancer vaccine"[tiab] OR "individualized neoantigen"[tiab])
    clinicaltrials:
      - {cond: "lung cancer", term: "mRNA vaccine"}                                    # new registrations
      - {cond: "lung cancer", term: "mRNA vaccine", date_field: ResultsFirstPostDate}  # results posted

  # ------------------------------------------------------------------ drug repurposing
  - id: lung-repurposed
    name: Lung cancer — repurposed (non-oncology) drugs
    enabled: true
    version: 1
    criteria: >
      Existing non-cancer drugs studied for lung cancer (NSCLC, SCLC): antihistamines
      (e.g. loratadine, cetirizine, desloratadine, diphenhydramine), metformin, statins, aspirin
      and NSAIDs, beta-blockers, antidiabetics (SGLT2, GLP-1), antibiotics/antifungals/antiparasitics
      (itraconazole, mebendazole, ivermectin, doxycycline), antipsychotics/antidepressants,
      disulfiram, bisphosphonates, vitamin D, and similar. HIGH: randomised trials and trial
      registrations; large prospective or population cohorts that adjust for confounding and
      report survival or response; effects on immunotherapy or EGFR-TKI outcomes (e.g. antihistamine
      use with ICIs); preclinical work with in vivo data and a stated clinical path.
      MEDIUM: smaller or single-centre retrospective cohorts, rigorous meta-analyses, in vivo-only studies.
      LOW: in vitro-only or docking/network-pharmacology papers, narrative reviews, case reports, and
      studies where the drug is only a covariate. Flag immortal-time bias and confounding by
      indication in observational studies.
    pubmed:
      query: >-
        ("lung cancer"[tiab] OR "lung cancers"[tiab] OR "lung carcinoma"[tiab]
        OR "lung adenocarcinoma"[tiab] OR NSCLC[tiab] OR SCLC[tiab]
        OR "non-small cell lung"[tiab] OR "non-small-cell lung"[tiab]
        OR "small cell lung"[tiab] OR "small-cell lung"[tiab])
        AND
        (repurpos*[tiab] OR repositioning[tiab] OR "drug repositioning"[mh]
        OR antihistamine*[tiab] OR "histamine H1"[tiab] OR "H1 antihistamine*"[tiab]
        OR loratadine[tiab] OR desloratadine[tiab] OR cetirizine[tiab] OR fexofenadine[tiab]
        OR diphenhydramine[tiab] OR cimetidine[tiab] OR famotidine[tiab]
        OR metformin[tiab] OR statin[tiab] OR statins[tiab] OR aspirin[tiab]
        OR "beta-blocker*"[tiab] OR propranolol[tiab] OR itraconazole[tiab]
        OR mebendazole[tiab] OR ivermectin[tiab] OR disulfiram[tiab] OR doxycycline[tiab]
        OR "SGLT2"[tiab] OR "GLP-1"[tiab] OR chloroquine[tiab] OR hydroxychloroquine[tiab])
    clinicaltrials:
      - {cond: "lung cancer", term: "repurposing OR antihistamine OR metformin OR statin OR propranolol OR loratadine"}
      - {cond: "lung cancer", term: "repurposing OR antihistamine OR metformin OR statin OR propranolol OR loratadine", date_field: ResultsFirstPostDate}

  # ------------------------------------------------------------------ CAR-T in solid tumours
  - id: car-t-solid
    name: CAR-T, CAR-NK, CAR-macrophage and TCR-T therapy in solid tumours (all types)
    enabled: true
    version: 2
    criteria: >
      Engineered cell therapy in any solid tumour (not haematological malignancies): CAR-T,
      CAR-NK, CAR-macrophage (CAR-M) and TCR-T/TCR-engineered cells (e.g. MAGE-A4, NY-ESO-1,
      PRAME, KRAS-neoantigen TCRs; TIL is out of scope). Tumour types include lung,
      GI, liver, pancreatic, brain (glioma/GBM, DIPG), neuroblastoma and other paediatric
      tumours, sarcoma, ovarian, breast, prostate, renal, mesothelioma, head and neck.
      HIGH: clinical trial results (any phase, with response rates, survival, toxicity such as
      CRS/ICANS/on-target off-tumour effects, and cell persistence); new trial registrations
      (note target antigen, e.g. claudin 18.2, GPC3, GD2, B7-H3, mesothelin, HER2, EGFR, CEA,
      and route, e.g. intratumoural, intraventricular, regional); regulatory decisions; novel
      constructs (armoured, logic-gated, in vivo CAR-T) with in vivo data and a stated clinical
      path. For TCR-T also note HLA restriction and target. MEDIUM: preclinical in vivo studies of new targets or combinations, rigorous
      meta-analyses of clinical trials, large real-world or manufacturing/safety series.
      LOW: in vitro-only work, narrative reviews, bioinformatic target-discovery papers, case
      reports, and papers that only mention solid tumours in passing. Report phase, n and
      follow-up for clinical data; do not generalise early-phase response rates.
    pubmed:
      query: >-
        ("CAR-T"[tiab] OR "CAR T"[tiab] OR "CAR-T cell"[tiab] OR "CAR-T cells"[tiab]
        OR "chimeric antigen receptor"[tiab] OR "chimeric antigen receptors"[tiab]
        OR "Receptors, Chimeric Antigen"[mh]
        OR "CAR-NK"[tiab] OR "CAR NK"[tiab] OR "CAR-NK cell"[tiab] OR "CAR-NK cells"[tiab]
        OR "CAR-macrophage"[tiab] OR "CAR-macrophages"[tiab] OR "CAR-M"[tiab]
        OR "CAR macrophage"[tiab] OR "CAR macrophages"[tiab]
        OR "TCR-T"[tiab] OR "TCR T"[tiab] OR "TCR-T cell"[tiab] OR "TCR-T cells"[tiab]
        OR "TCR-engineered"[tiab] OR "engineered T cell receptor"[tiab]
        OR "engineered TCR"[tiab] OR "TCR-transgenic"[tiab])
        AND
        ("solid tumor"[tiab] OR "solid tumors"[tiab] OR "solid tumour"[tiab] OR "solid tumours"[tiab]
        OR "solid cancer"[tiab] OR "solid cancers"[tiab]
        OR "lung cancer"[tiab] OR NSCLC[tiab] OR SCLC[tiab] OR mesothelioma[tiab]
        OR glioma[tiab] OR glioblastoma[tiab] OR "diffuse midline glioma"[tiab]
        OR neuroblastoma[tiab] OR sarcoma[tiab] OR medulloblastoma[tiab]
        OR "hepatocellular carcinoma"[tiab] OR "pancreatic cancer"[tiab]
        OR "pancreatic ductal adenocarcinoma"[tiab] OR "gastric cancer"[tiab]
        OR "gastroesophageal"[tiab] OR "colorectal cancer"[tiab]
        OR "ovarian cancer"[tiab] OR "breast cancer"[tiab] OR "prostate cancer"[tiab]
        OR "renal cell carcinoma"[tiab] OR melanoma[tiab] OR "head and neck"[tiab]
        OR "biliary tract"[tiab] OR cholangiocarcinoma[tiab] OR "bladder cancer"[tiab]
        OR "cervical cancer"[tiab] OR "endometrial cancer"[tiab]
        OR "claudin 18.2"[tiab] OR "CLDN18.2"[tiab] OR GPC3[tiab] OR GD2[tiab]
        OR "B7-H3"[tiab] OR mesothelin[tiab])
        NOT
        (lymphoma[ti] OR lymphomas[ti] OR leukemia[ti] OR leukaemia[ti] OR myeloma[ti]
        OR "B-cell"[ti] OR "B cell"[ti] OR lupus[ti] OR "autoimmune"[ti])
    clinicaltrials:
      - {intr: "chimeric antigen receptor OR CAR-NK OR CAR-macrophage OR TCR-T OR \"T cell receptor\"", term: "solid tumor OR glioma OR glioblastoma OR neuroblastoma OR sarcoma OR carcinoma OR mesothelioma OR melanoma"}
      - {intr: "chimeric antigen receptor OR CAR-NK OR CAR-macrophage OR TCR-T OR \"T cell receptor\"", term: "solid tumor OR glioma OR glioblastoma OR neuroblastoma OR sarcoma OR carcinoma OR mesothelioma OR melanoma", date_field: ResultsFirstPostDate}

  # ------------------------------------------------------------------ preprints
  - id: preprints
    name: Lung cancer preprints (medRxiv, bioRxiv)
    enabled: true
    version: 1
    criteria: >
      Preprints are not peer reviewed, so say so in the digest. HIGH only for trial results or
      striking EGFR/resistance findings; most items should be MEDIUM or LOW.
    feeds:
      - http://connect.medrxiv.org/medrxiv_xml.php?subject=Oncology
      - http://connect.biorxiv.org/biorxiv_xml.php?subject=cancer_biology
    feed_keywords: [lung, nsclc, sclc, egfr]

  # ------------------------------------------------------------------ approvals and access
  - id: approvals-access
    name: Approvals, reimbursement and access
    enabled: true
    version: 1
    criteria: >
      Regulatory and access decisions for lung cancer drugs: FDA approvals, EMA/CHMP opinions,
      Norwegian Nye Metoder decisions. HIGH: any decision on an EGFR-directed therapy or a
      lung cancer drug. Ignore pages older than about two months unless they are decisions
      not yet recorded in this repo.
    web:
      - 'FDA approves lung cancer site:fda.gov'
      - 'CHMP opinion lung cancer site:ema.europa.eu'
      - 'lungekreft beslutning site:nyemetoder.no'
