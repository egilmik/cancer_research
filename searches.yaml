        OR "MET exon 14"[tiab] OR METex14[tiab] OR "MET amplification"[tiab]
        OR HER2[tiab] OR ERBB2[tiab] OR NTRK[tiab] OR NRG1[tiab]
        OR "oncogene-driven"[tiab] OR "driver mutation"[tiab] OR "driver mutations"[tiab]
        OR "driver-positive"[tiab] OR "actionable alteration*"[tiab]
        OR alectinib[tiab] OR lorlatinib[tiab] OR brigatinib[tiab] OR ensartinib[tiab]
        OR crizotinib[tiab] OR iruplinalkib[tiab] OR neladalkib[tiab] OR "NVL-655"[tiab]
        OR taletrectinib[tiab] OR repotrectinib[tiab] OR zidesamtinib[tiab] OR "NVL-520"[tiab]
        OR entrectinib[tiab] OR larotrectinib[tiab]
        OR sotorasib[tiab] OR adagrasib[tiab] OR divarasib[tiab] OR olomorasib[tiab]
        OR glecirasib[tiab] OR garsorasib[tiab] OR fulzerasib[tiab] OR zoldonrasib[tiab]
        OR daraxonrasib[tiab] OR "RMC-6236"[tiab] OR elironrasib[tiab]
